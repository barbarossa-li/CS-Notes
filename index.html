<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Gang Wang 的个人主页。">
  <meta name="color-scheme" content="light">
  <title>Gang Wang</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f4efe6'/%3E%3Crect x='3' y='3' width='26' height='26' fill='none' stroke='%238f3d32' stroke-width='2'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Georgia,serif' font-size='11' fill='%238f3d32'%3EGW%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <a class="skip" href="#main">跳到正文</a>

  <header class="site-header">
    <div class="header-bar">
      <a class="brand" href="#intro">Gang Wang</a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="site-nav">
        <span class="when-closed">菜单</span>
        <span class="when-open">关闭</span>
      </button>
      <nav id="site-nav" class="site-nav" aria-label="页内导航">
        <a href="#intro" aria-current="true">简介</a>
        <a href="#about">关于</a>
        <a href="#projects">项目</a>
        <a href="#contact">联系</a>
      </nav>
    </div>
  </header>

  <main id="main" tabindex="-1">
    <section class="intro" id="intro" aria-labelledby="page-title">
      <div class="intro-name">
        <p class="mark" aria-hidden="true">GW</p>
        <p class="eyebrow">个人主页</p>
        <h1 id="page-title">Gang Wang</h1>
      </div>
      <div class="intro-copy">
        <p class="slot-tag">待填写</p>
        <p class="lede"><span class="blank">在这里写一句介绍自己的话。</span></p>
      </div>
    </section>

    <section class="band" id="about" aria-labelledby="about-title">
      <div class="section about-grid">
        <h2 id="about-title">关于</h2>
        <div>
          <p class="slot-tag">待填写</p>
          <p class="measure"><span class="blank">在这里写几句关于你自己的话。这是占位，没有填写具体经历。</span></p>
        </div>
      </div>
    </section>

    <section class="section" id="projects" aria-labelledby="projects-title">
      <div class="section-head">
        <h2 id="projects-title">项目</h2>
        <p class="measure hint">这几条是空位。改成你的项目，用不到的删掉。</p>
      </div>
      <ol class="projects">
        <li>
          <h3>
            <span class="blank">项目名称</span>
            <span class="slot-tag">待填写</span>
          </h3>
          <p><span class="blank">一句话说明这个项目。</span></p>
        </li>
        <li>
          <h3>
            <span class="blank">项目名称</span>
            <span class="slot-tag">待填写</span>
          </h3>
          <p><span class="blank">可以补一句近况，或一个链接。</span></p>
        </li>
        <li>
          <h3>
            <span class="blank">项目名称</span>
            <span class="slot-tag">待填写</span>
          </h3>
          <p><span class="blank">用不到这一条的话，直接删掉。</span></p>
        </li>
      </ol>
    </section>

    <section class="section contact" id="contact" aria-labelledby="contact-title">
      <h2 id="contact-title">联系</h2>
      <div class="contact-slot">
        <p class="slot-tag">待填写</p>
        <p class="lede contact-line"><span class="blank">在这里写邮箱或其他联系方式。</span></p>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <p class="footer-name">Gang Wang</p>
    <p class="fine">标有「待填写」的文字，都可以换成你自己的内容。</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
